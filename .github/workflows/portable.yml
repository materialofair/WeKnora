name: Portable and Electron packages
on:
  workflow_dispatch:
  push:
    branches: [portable]
concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Windows GNU toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: mingw-w64-x86_64-toolchain
      - name: Install dependencies
        shell: bash
        run: |
          npm ci --prefix frontend
          npm ci --prefix desktop
      - name: Build Unix bundle
        if: runner.os != 'Windows'
        run: node scripts/package-portable.mjs
      - name: Build Windows bundle
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          TARGET: x86_64-pc-windows-gnu
          CC: gcc
          CXX: g++
        run: |
          rustup target add x86_64-pc-windows-gnu
          node scripts/package-portable.mjs
      - name: Verify native runtime
        shell: bash
        run: |
          node scripts/smoke-portable.cjs
          node scripts/smoke-ingestion.cjs
          npm test --prefix desktop
      - name: Verify SQLite Wiki and history
        if: runner.os != 'Windows'
        run: go test -tags sqlite_fts5 ./internal/application/repository -run 'TestWiki|TestSessionRepository'
      - name: Package Electron
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist --prefix desktop
      - name: Archive Unix executables with permissions
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bundle=$(node -p 'process.platform + "-" + process.arch')
          tar -czf "dist/knowledge-assistant-${RUNNER_OS}.tar.gz" -C dist/portable "$bundle"
          for executable in dist/electron/*.AppImage; do
            [ -f "$executable" ] || continue
            tar -czf "$executable.tar.gz" -C dist/electron "$(basename "$executable")"
          done
      - name: Archive Windows portable service
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/portable/win32-x64 -DestinationPath dist/knowledge-assistant-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-assistant-${{ matrix.os }}
          path: |
            dist/knowledge-assistant-*.tar.gz
            dist/knowledge-assistant-*.zip
            dist/electron/*.dmg
            dist/electron/*.zip
            dist/electron/*.exe
            dist/electron/*.AppImage.tar.gz
          if-no-files-found: error
